<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="videoSim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="50%" stop-color="#281a30"/>
      <stop offset="100%" stop-color="#0e1322"/>
    </linearGradient>
  </defs>

  <!-- Simulated Video Content -->
  <rect width="1280" height="720" fill="url(#videoSim)"/>

  <!-- Video Playback Artifacts (Abstract Cinematic art) -->
  <circle cx="640" cy="380" r="160" fill="#6366f1" fill-opacity="0.2"/>
  <circle cx="700" cy="340" r="120" fill="#ec4899" fill-opacity="0.2"/>
  <circle cx="580" cy="400" r="100" fill="#38bdf8" fill-opacity="0.15"/>
  <polygon points="630,340 630,420 700,380" fill="white" fill-opacity="0.3"/>

  <!-- Top Floating Glass Control Pill (The HUD Overlay) -->
  <g transform="translate(260, 20)" filter="url(#pillShadow)">
    <!-- Main Capsule Body -->
    <rect width="760" height="54" rx="20" fill="#18181b" fill-opacity="0.92" stroke="white" stroke-opacity="0.18" stroke-width="1.2"/>

    <!-- Left Controls: Home, Back, Forward, Reload -->
    <g transform="translate(14, 11)">
      <!-- Home Icon -->
      <rect width="32" height="32" rx="8" fill="white" fill-opacity="0.1"/>
      <path d="M16 8l-8 7h3v8h4v-5h2v5h4v-8h3z" fill="white"/>

      <!-- Divider -->
      <line x1="42" y1="6" x2="42" y2="26" stroke="white" stroke-opacity="0.2"/>

      <!-- Back Arrow -->
      <g transform="translate(50, 0)">
        <rect width="32" height="32" rx="8" fill="transparent"/>
        <path d="M19 11l-5 5 5 5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Forward Arrow -->
      <g transform="translate(86, 0)">
        <rect width="32" height="32" rx="8" fill="transparent"/>
        <path d="M13 11l5 5-5 5" stroke="white" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Reload -->
      <g transform="translate(122, 0)">
        <rect width="32" height="32" rx="8" fill="transparent"/>
        <path d="M21 16a5 5 0 1 1-1.5-3.5L22 10" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Center Info: Site Favicon + Page Title + Hostname -->
    <g transform="translate(182, 11)">
      <!-- YouTube Favicon / Logo -->
      <rect x="0" y="6" width="20" height="20" rx="5" fill="#FF0000"/>
      <polygon points="8,11 8,21 14,16" fill="white" transform="scale(0.8) translate(2, -2)"/>
      
      <!-- Titles -->
      <text x="28" y="16" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Interstellar Soundtrack Suite — Live in Prague</text>
      <text x="28" y="28" fill="white" fill-opacity="0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">youtube.com</text>
    </g>

    <!-- Right Controls: Ghostery Adblocker, Mute, PiP, Zoom, Fullscreen -->
    <g transform="translate(485, 11)">
      <!-- Shield / AdBlocker Button with Badge -->
      <rect width="44" height="32" rx="8" fill="#10b981" fill-opacity="0.2"/>
      <path d="M16 9l6 3v5c0 4-3 7-6 8-3-1-6-4-6-8v-5z" stroke="#34d399" stroke-width="1.6" fill="none"/>
      <!-- Block Count Badge -->
      <rect x="24" y="-3" width="22" height="15" rx="7.5" fill="#10b981"/>
      <text x="35" y="8" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">38</text>

      <!-- Audio Mute -->
      <g transform="translate(48, 0)">
        <rect width="32" height="32" rx="8" fill="transparent"/>
        <path d="M11 13h3l4-4v14l-4-4h-3z" fill="white"/>
        <path d="M20 12c1.5 2 1.5 6 0 8" stroke="white" stroke-width="1.6" fill="none"/>
      </g>

      <!-- Picture In Picture (PiP) -->
      <g transform="translate(84, 0)">
        <rect width="32" height="32" rx="8" fill="transparent"/>
        <rect x="8" y="10" width="16" height="12" rx="2" stroke="white" stroke-width="1.6" fill="none"/>
        <rect x="16" y="14" width="7" height="6" rx="1" fill="white"/>
      </g>

      <!-- Zoom In / Out -->
      <g transform="translate(120, 0)">
        <rect width="32" height="32" rx="8" fill="transparent"/>
        <circle cx="15" cy="15" r="5" stroke="white" stroke-width="1.6" fill="none"/>
        <line x1="19" y1="19" x2="23" y2="23" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="13" y1="15" x2="17" y2="15" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </g>

      <!-- Fullscreen Toggle -->
      <g transform="translate(156, 0)">
        <rect width="32" height="32" rx="8" fill="transparent"/>
        <path d="M10 14v-4h4m8 0h4v4m0 8v4h-4m-8 0h-4v-4" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>