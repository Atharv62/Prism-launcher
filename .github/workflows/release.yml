name: Release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # installer file names come from package.json, so a mismatched tag would ship the wrong version
      - run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version')"
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
